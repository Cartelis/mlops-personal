name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build CPU image
        run: docker build -f docker/Dockerfile.cpu -t mlops-cpu:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: mlops-cpu:ci
          format: table
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: mlops-cpu:ci
          format: spdx-json
          output: sbom-cpu.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cpu
          path: sbom-cpu.json

  policy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Gatekeeper policy files exist
        run: |
          test "$(find security/policies -name '*.yaml' | wc -l)" -ge 3
      - name: Verify network policy manifest
        run: test -f k8s/network-policy-fraud-api.yaml