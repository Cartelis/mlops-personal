name: Week 3 containers

# Standalone fraud-detection project. The course repository has its own copy
# with PROJECT_DIR set to tutorial/fraud-detection.
#
# Branch pushes run the small amd64 matrix; tags/manual runs select more jobs.
# Private repositories may consume metered Actions minutes.
# Release tags ending in -cpu omit all GPU build/scan/publish steps.
on:
  push:
    branches: ['main']
    tags: ['week3-v1.2.*']
  workflow_dispatch:
    inputs:
      full_matrix:
        description: 'Also build the arm64 images and the CUDA image (metered minutes)'
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PROJECT_DIR: .

jobs:
  plan:
    name: Choose the build matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Light matrix on branch pushes, full matrix on tags and manual runs
        id: pick
        env:
          INCLUDE_GPU: ${{ !endsWith(github.ref_name, '-cpu') }}
          FULL: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.full_matrix) }}
        run: |
          if [ "$FULL" = true ]; then
            include='[
              {"variant": "cpu",  "arch": "amd64", "runner": "ubuntu-24.04"},
              {"variant": "cpu",  "arch": "arm64", "runner": "ubuntu-24.04-arm"},
              {"variant": "onnx", "arch": "amd64", "runner": "ubuntu-24.04"},
              {"variant": "onnx", "arch": "arm64", "runner": "ubuntu-24.04-arm"},
              {"variant": "gpu",  "arch": "amd64", "runner": "ubuntu-24.04"}
            ]'
          else
            include='[
              {"variant": "cpu",  "arch": "amd64", "runner": "ubuntu-24.04"},
              {"variant": "onnx", "arch": "amd64", "runner": "ubuntu-24.04"}
            ]'
          fi
          if [ "$INCLUDE_GPU" != true ]; then
            include="$(jq -c 'map(select(.variant != "gpu"))' <<<"$include")"
          fi
          matrix="$(jq -c '{include: .}' <<<"$include")"
          echo "Matrix for this run: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build-scan:
    name: ${{ matrix.variant }} / ${{ matrix.arch }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Create the model using the image's pinned sklearn environment
        if: matrix.variant != 'gpu'
        run: |
          cd "$PROJECT_DIR"
          python -m pip install -r requirements-export.txt
          python scripts/bootstrap.py
          python scripts/export_onnx.py
      - name: Check API validation and CPU/ONNX prediction parity
        if: matrix.variant != 'gpu'
        run: |
          cd "$PROJECT_DIR"
          python -m pip install -r requirements-week3-test.txt
          python -m pytest tests/test_api.py tests/test_week3_runtime.py tests/test_week3_checks.py -q
      - name: Set image name and validate version
        id: meta
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          namespace="${GITHUB_REPOSITORY,,}"
          version="sha-${GITHUB_SHA:0:12}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^week3-v1\.2\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
            version="${GITHUB_REF_NAME#week3-}"
          fi
          echo "image=ghcr.io/$namespace/mlops-$VARIANT" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Reserve disk space for CUDA on this disposable GitHub runner
        if: matrix.variant == 'gpu'
        # Standard runners have limited free disk. These preinstalled SDKs are
        # unrelated to this Python/Docker job; image extraction + scanning is large.
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet
          df -h /
      - name: Build a local image before any registry login or push
        id: build
        env:
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        # Native per-architecture runners need no QEMU. The Docker driver also
        # avoids keeping a second GPU image copy in a separate BuildKit container.
        run: |
          docker build --platform "linux/$ARCH" \
            -f "$PROJECT_DIR/docker/Dockerfile.$VARIANT" \
            -t "week3-$VARIANT:ci" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" "$PROJECT_DIR"
      - name: Verify the process runs as non-root
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          docker run --rm --entrypoint python "week3-$VARIANT:ci" \
            -c 'import os; assert os.getuid() != 0, "Container must run as non-root"'
      - name: Exercise CPU or ONNX HTTP API and Docker healthcheck
        if: matrix.variant != 'gpu'
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          trap 'docker logs week3-ci; docker rm -f week3-ci >/dev/null' EXIT
          docker run -d --name week3-ci --memory=512m --cpus=2 \
            -p 127.0.0.1:8080:8080 "week3-$VARIANT:ci"
          for attempt in $(seq 1 60); do
            health="$(docker inspect -f '{{.State.Health.Status}}' week3-ci)"
            if [ "$health" = healthy ]; then break; fi
            if [ "$health" = unhealthy ]; then exit 1; fi
            sleep 1
          done
          test "$health" = healthy
          python - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5) as response:
              assert json.load(response)['status'] == 'ok'
          body = json.dumps({f'f{i}': 0.1 for i in range(10)}).encode()
          request = urllib.request.Request('http://127.0.0.1:8080/predict', body,
                                           {'Content-Type': 'application/json'})
          with urllib.request.urlopen(request, timeout=5) as response:
              assert json.load(response)['prediction'] in (0, 1)
          PY
      - name: Verify CUDA-enabled PyTorch is installed (hardware is not tested here)
        if: matrix.variant == 'gpu'
        run: |
          docker run --rm --entrypoint python week3-gpu:ci \
            -c 'import torch; assert torch.version.cuda; print("CUDA build:", torch.version.cuda, "GPU execution still requires the NVIDIA host smoke test")'
      - name: Prepare scan report directory
        run: mkdir -p "$PROJECT_DIR/reports"
      - name: Trivy gate - block publication on any CRITICAL vulnerability
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: week3-${{ matrix.variant }}:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: ${{ env.PROJECT_DIR }}/reports/trivy-${{ matrix.variant }}-${{ matrix.arch }}.json
          timeout: 20m
      - name: Upload the scan report even when the gate fails
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ env.PROJECT_DIR }}/reports/trivy-${{ matrix.variant }}-${{ matrix.arch }}.json
          if-no-files-found: warn
      - name: Log in to GHCR after the checks pass
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the exact scanned image under its architecture tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          IMAGE: ${{ steps.meta.outputs.image }}
          VERSION: ${{ steps.meta.outputs.version }}
          VARIANT: ${{ matrix.variant }}
          ARCH: ${{ matrix.arch }}
        run: |
          docker tag "week3-$VARIANT:ci" "$IMAGE:$VERSION-$ARCH"
          docker push "$IMAGE:$VERSION-$ARCH"

  publish-manifests:
    # Final release tags appear only after ALL selected build/scan jobs succeed.
    # A failed job may leave passing architecture tags; no failed image is pushed.
    needs: build-scan
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish CPU/ONNX multiarch tags and GPU when selected
        run: |
          namespace="${GITHUB_REPOSITORY,,}"
          version="${GITHUB_REF_NAME#week3-}"
          for variant in cpu onnx; do
            image="ghcr.io/$namespace/mlops-$variant"
            docker buildx imagetools create --tag "$image:$version" \
              "$image:$version-amd64" "$image:$version-arm64"
          done
          if [[ "$GITHUB_REF_NAME" != *-cpu ]]; then
            image="ghcr.io/$namespace/mlops-gpu"
            docker buildx imagetools create --tag "$image:$version" "$image:$version-amd64"
          fi
