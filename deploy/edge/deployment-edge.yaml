apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlops-fraud-edge
  namespace: mlops
  labels:
    tier: edge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlops-fraud-edge
  template:
    metadata:
      labels:
        app: mlops-fraud-edge
        tier: edge
    spec:
      containers:
        - name: edge-api
          image: mlops-edge:v1.3.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MODEL_PATH
              value: /app/models/model.edge.onnx
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: mlops-fraud-edge
  namespace: mlops
spec:
  selector:
    app: mlops-fraud-edge
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: ClusterIP