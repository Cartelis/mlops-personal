apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-detector
  namespace: mlops
spec:
  predictor:
    containers:
      - name: kserve-container
        image: ghcr.io/<org>/mlops-onnx:v1.2.0
        env:
          - name: MODEL_PATH
            value: /app/models/model.onnx
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "2"
            memory: "1Gi"