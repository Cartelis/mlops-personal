# AWS Karpenter NodePool with spot capacity (week 12 reference)
# Requires: Karpenter v1+ installed, EC2NodeClass configured
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: mlops-inference-spot
spec:
  template:
    metadata:
      labels:
        workload: mlops-inference
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: mlops-default
      requirements:
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot", "on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
        - key: node.kubernetes.io/instance-type
          operator: In
          values: ["m6i.large", "m6i.xlarge", "c6i.large"]
      taints: []
  limits:
    cpu: 200
    memory: 400Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m