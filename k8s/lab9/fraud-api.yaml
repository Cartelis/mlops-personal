# The model service of the lab: the week-3 FastAPI app (src/serve.py) loading the registry alias
# models:/fraud-detector@champion at start-up instead of a pickle baked into the image.
# Until a champion exists the pod reports "no model" on /health and stays not-ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraud-api
  namespace: mlops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fraud-api
  template:
    metadata:
      labels:
        app: fraud-api
    spec:
      containers:
        - name: api
          image: fraud-train:lab9
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.serve:app", "--host", "0.0.0.0", "--port", "8080"]
          env:
            - name: MODEL_URI
              value: models:/fraud-detector@champion
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow.mlops.svc:5000
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "768Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fraud-api
  namespace: mlops
spec:
  selector:
    app: fraud-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
