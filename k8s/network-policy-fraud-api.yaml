apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlops-fraud-api-netpol
  namespace: mlops
spec:
  podSelector:
    matchLabels:
      app: mlops-fraud-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: UDP
          port: 53