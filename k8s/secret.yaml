# Jautrūs raktai (API keys) - NIEKADA ne ConfigMap'e, tik Secret.
# stringData: raktai plain text - API serveris pats uz'koduoja base64 apply metu.
# Produkcijoje: external secrets operatorius arba cloud KMS, ne git'e saugomi raktai.
apiVersion: v1
kind: Secret
metadata:
  name: mlops-secrets
  namespace: mlops
type: Opaque
stringData:
  FRAUD_API_KEY: "change-me-dev-key"
  MLFLOW_AUTH_TOKEN: "change-me-token"
