# Headless Service DDP: suteikia pod'ams stabilus DNS vardus (diskovery, NE load balancing).
# Reikalingas, nes CoreDNS nepasaulio pod'u vardu be Service.
# publishNotReadyAddresses: DNS irasai rodomi PRIES pod'ams tampant Ready --
# kitaip rendezvous metu (starto pradzioje) vardai neisspresimi ir DDP hang'insis.
apiVersion: v1
kind: Service
metadata:
  name: pytorch-ddp-train
  namespace: mlops
spec:
  clusterIP: None  # headless
  publishNotReadyAddresses: true
  selector:
    job-name: pytorch-ddp-train  # vienam Service -- VISI Job'o pod'ai
  ports:
    - port: 29500
      targetPort: 29500
