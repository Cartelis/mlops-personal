groups:
  - name: fraud-api
    rules:
      - alert: FraudApiHighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum(rate(fraud_api_request_duration_seconds_bucket[5m])) by (le)
          ) > 0.08
        for: 5m
        labels:
          severity: warning
          service: fraud-api
        annotations:
          summary: "Fraud API p95 latency above 80ms"
          description: "p95 latency exceeded SLO for 5 minutes."

      - alert: FraudApiHighErrorRate
        expr: |
          sum(rate(fraud_api_requests_total{status=~"5.."}[5m]))
          /
          sum(rate(fraud_api_requests_total[5m])) > 0.001
        for: 5m
        labels:
          severity: critical
          service: fraud-api
        annotations:
          summary: "Fraud API error rate above 0.1%"

      - alert: FraudDataDrift
        expr: fraud_drift_psi > 0.25
        for: 10m
        labels:
          severity: warning
          service: fraud-api
        annotations:
          summary: "Feature drift PSI above threshold"
          description: "Consider triggering self-healing agent (week 10)."