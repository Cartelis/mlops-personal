global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: fraud-api
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          app: mlops-fraud-api
          env: lab

  - job_name: drift-exporter
    static_configs:
      - targets: ["host.docker.internal:9101"]
        labels:
          app: fraud-drift-exporter