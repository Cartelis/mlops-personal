# M2: the "insider". Imagine a pod whose code was compromised (a malicious dependency,
# a poisoned pickle model...). Note: it follows ALL 4 vault rules, so Gatekeeper lets it in.
# Lesson: policies check HOW a pod is configured, not WHAT its code does.
# Question for M2: can it read the internal mlflow? (it should not)
apiVersion: v1
kind: Pod
metadata:
  name: attacker
  namespace: vault
  labels: {app: attacker}
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: shell
      image: busybox:1.36
      command: ["sleep", "86400"]
      resources:
        requests: {cpu: 5m, memory: 8Mi}
        limits: {cpu: 50m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
