# Vault rule 2: containers must declare runAsNonRoot: true.
# Accepted on the container securityContext or on the pod-level securityContext.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirenonroot
spec:
  crd:
    spec:
      names:
        kind: K8sRequireNonRoot
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirenonroot

        podspec := input.review.object.spec { input.review.object.kind == "Pod" }
        podspec := input.review.object.spec.template.spec { input.review.object.kind != "Pod" }

        pod_non_root { podspec.securityContext.runAsNonRoot == true }

        violation[{"msg": msg}] {
          c := podspec.containers[_]
          not c.securityContext.runAsNonRoot == true
          not pod_non_root
          msg := sprintf("[non-root] container '%v' must set securityContext.runAsNonRoot: true", [c.name])
        }
