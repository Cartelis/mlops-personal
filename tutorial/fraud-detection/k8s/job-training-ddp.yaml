# Multi-node DDP (2 pods, 1 GPU each).
# master_addr sprendziamas per service-headless-ddp.yaml (headless Service).
apiVersion: batch/v1
kind: Job
metadata:
  name: pytorch-ddp-train
  namespace: mlops
spec:
  parallelism: 2
  completions: 2
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        accelerator: nvidia
      tolerations:
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: trainer
          image: mlops-gpu:v1.2.0
          imagePullPolicy: IfNotPresent
          workingDir: /app
          command: ["torchrun"]
          args:
            - "--nproc_per_node=1"
            - "--nnodes=2"
            - "--node_rank=$(JOB_COMPLETION_INDEX)"
            - "--master_addr=pytorch-ddp-train-0.pytorch-ddp-train"
            - "--master_port=29500"
            - "src/train_ddp.py"
            - "--epochs=5"
          env:
            - name: NCCL_DEBUG
              value: "INFO"
          resources:
            limits:
              nvidia.com/gpu: 1
            requests:
              nvidia.com/gpu: 1
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mlops-data