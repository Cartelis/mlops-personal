apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: mlops-fraud-api-scaler
  namespace: mlops
spec:
  scaleTargetRef:
    name: mlops-fraud-api
  pollingInterval: 30
  cooldownPeriod: 120
  minReplicaCount: 1
  maxReplicaCount: 50
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc:9090
        metricName: fraud_api_rps
        query: sum(rate(fraud_api_requests_total[2m]))
        threshold: "100"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "70"