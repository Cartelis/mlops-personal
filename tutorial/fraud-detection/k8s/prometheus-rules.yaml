apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fraud-api-alerts
  namespace: mlops
  labels:
    release: prometheus
spec:
  groups:
    - name: fraud-api
      rules:
        - alert: FraudApiHighLatencyP95
          expr: |
            histogram_quantile(0.95,
              sum(rate(fraud_api_request_duration_seconds_bucket[5m])) by (le)
            ) > 0.08
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Fraud API p95 latency above 80ms"
        - alert: FraudDataDrift
          expr: fraud_drift_psi > 0.25
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Feature drift PSI above threshold"